# /etc/nginx/sites-available/smt-onic
# Config nginx para SMT-ONIC · ingeniería ONIC
# Generado por Sprint S2 · 2026-05-03
#
# Tras copiar:
#   sudo ln -sf /etc/nginx/sites-available/smt-onic /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d smt-onic.com -d www.smt-onic.com
#   sudo nginx -t && sudo systemctl reload nginx

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name smt-onic.com www.smt-onic.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smt-onic.com www.smt-onic.com;

    # TLS · certbot llena estos paths automáticamente
    ssl_certificate     /etc/letsencrypt/live/smt-onic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smt-onic.com/privkey.pem;

    # TLS hardening (Mozilla intermediate · 2026)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Tamaño máximo de upload (para futuros endpoints de carga manual)
    client_max_body_size 25M;

    # Logs
    access_log /var/log/nginx/smt-onic.access.log;
    error_log  /var/log/nginx/smt-onic.error.log warn;

    # ─── API · proxy a FastAPI en :8095 ───
    location /api/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ─── Frontend estático · React build ───
    location / {
        root /var/www/smt-onic-frontend;
        try_files $uri $uri/ /index.html;

        # Cache assets con hash en nombre · 1 año
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # index.html nunca cachear · siempre revalidar
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ─── Bloquear acceso a paths sensibles ───
    location ~ /\.(env|git|ht) {
        deny all;
        return 404;
    }
}
