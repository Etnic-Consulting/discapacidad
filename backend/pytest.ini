[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# conftest.py (raíz de backend/) añade backend/ a sys.path en pytest_configure.
# Esto funciona tanto desde backend/ como desde el repo raíz (copia github/).

[coverage:run]
# Cuando pytest corre con --cov=backend/app/routers/pueblos (path-con-slashes),
# pytest-cov no puede resolver el módulo porque se importa como app.routers.pueblos
# (backend/ está en sys.path).  La solución es usar --cov=app.routers.pueblos
# o --cov=backend/app/routers (directorio).
# Este bloque configura el source para que `coverage` capture app.*
source =
    app

[coverage:paths]
source =
    app
    backend/app
    */backend/app
